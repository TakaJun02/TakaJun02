name: Refresh activity

on:
  schedule:
    - cron: "0 15 * * *" # daily at 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity

jobs:
  transcript:
    # Rewrites the Activity block in README.md (TJ-02's mood, the year's
    # context meter, today's omikuji) and commits only if it changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "Refresh activity"; git push; }
