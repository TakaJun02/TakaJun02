name: Refresh activity

on:
  schedule:
    - cron: "0 15 * * *" # daily at 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity

jobs:
  publish:
    # Draws the Activity window and publishes it to the `output` branch,
    # which README.md loads it from. Nothing is committed to main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Contribution snake
        # Only its animation is used: update_activity.py redraws the cells
        # and the snake as glyphs in the window's own colours.
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark
      - name: Activity window
        run: python3 scripts/update_activity.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
