name: Refresh activity

on:
  schedule:
    - cron: "0 15 * * *" # daily at 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity

jobs:
  snake:
    # Draws the contribution graph as a snake game and publishes the SVGs to
    # the `output` branch, which README.md loads them from.
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#C8643F
            dist/snake-dark.svg?palette=github-dark&color_snake=#D97757
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  transcript:
    # Rewrites the Activity block in README.md and commits only if it changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "Refresh activity"; git push; }
