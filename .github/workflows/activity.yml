name: Refresh activity

on:
  schedule:
    - cron: "0 15 * * *" # daily at 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity

jobs:
  publish:
    # Draws the Activity images and publishes them to the `output` branch,
    # which README.md loads them from. Nothing is committed to main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#C8643F
            dist/snake-dark.svg?palette=github-dark&color_snake=#D97757
      - name: TJ-02 activity report
        run: python3 scripts/update_activity.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
